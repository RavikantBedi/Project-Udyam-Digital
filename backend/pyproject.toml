[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
ignore = [
    # FastAPI standard pattern - Depends in argument defaults
    "B008",
    # Implicit Optional is fine for FastAPI path/query params
    "RUF013",
    # Useless if-else in some template code
    "RUF034",
    # Line too long - multilingual text and dict literals make long lines unavoidable
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["-v"]
